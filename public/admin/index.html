<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wander Bike Rentals — Website Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-light: #ccfbf1;
      --slate-950: #020617;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --radius: 1rem;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Login ── */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(15,23,42,.10);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      width: 48px; height: 48px;
      background: var(--teal);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    .login-logo svg { width: 26px; height: 26px; fill: white; }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; color: var(--slate-950); }
    .login-card p { margin-top: .4rem; font-size: .9rem; color: var(--slate-600); }
    .login-card label {
      display: block;
      margin-top: 1.5rem;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--slate-600);
    }
    .login-card input {
      width: 100%;
      margin-top: .5rem;
      padding: .75rem 1rem;
      border: 1px solid var(--slate-200);
      border-radius: .75rem;
      font-size: .95rem;
      color: var(--slate-900);
      outline: none;
      transition: border-color .15s;
    }
    .login-card input:focus { border-color: var(--teal); }
    #login-error {
      margin-top: .75rem;
      font-size: .85rem;
      color: #dc2626;
      display: none;
    }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; margin-top: 1.25rem;
      padding: .8rem 1.5rem;
      background: var(--teal);
      color: white;
      border: none; border-radius: .75rem;
      font-size: .95rem; font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--teal-dark); }

    /* ── App Shell ── */
    #app { display: none; flex-direction: column; height: 100vh; }
    header {
      padding: .9rem 1.5rem;
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .header-brand { display: flex; align-items: center; gap: .75rem; }
    .brand-dot {
      width: 32px; height: 32px;
      background: var(--teal);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-dot svg { width: 18px; height: 18px; fill: white; }
    .brand-name { font-size: .95rem; font-weight: 700; color: var(--slate-950); }
    .brand-sub { font-size: .78rem; color: var(--slate-500); margin-top: .05rem; }
    .btn-logout {
      font-size: .8rem;
      color: var(--slate-600);
      background: none;
      border: 1px solid var(--slate-200);
      border-radius: .6rem;
      padding: .35rem .8rem;
      cursor: pointer;
    }
    .btn-logout:hover { background: var(--slate-100); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg { max-width: 760px; width: 100%; margin: 0 auto; }
    .msg-user {
      align-self: flex-end;
      max-width: 560px;
      background: var(--teal);
      color: white;
      border-radius: 1.2rem 1.2rem 0 1.2rem;
      padding: .85rem 1.1rem;
      font-size: .9rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg-bot {
      align-self: flex-start;
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 1.2rem 1.2rem 1.2rem 0;
      padding: 1rem 1.2rem;
      font-size: .9rem;
      line-height: 1.6;
      color: var(--slate-700);
      box-shadow: 0 2px 8px rgba(15,23,42,.05);
      max-width: 100%;
    }
    .msg-bot strong { color: var(--slate-950); }

    /* ── Typing indicator ── */
    .typing {
      display: flex; align-items: center; gap: .4rem;
      padding: .9rem 1.1rem;
    }
    .typing span {
      width: 7px; height: 7px;
      background: var(--slate-400);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Preview card ── */
    .preview-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(15,23,42,.07);
    }
    .preview-header {
      padding: .9rem 1.2rem;
      background: var(--slate-50);
      border-bottom: 1px solid var(--slate-200);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--slate-600);
    }
    .preview-summary {
      padding: 1rem 1.2rem;
      font-size: .9rem;
      color: var(--slate-700);
      border-bottom: 1px solid var(--slate-100);
    }
    .changes-list { padding: .5rem 0; }
    .change-row {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      gap: .5rem;
      align-items: start;
      padding: .6rem 1.2rem;
      border-bottom: 1px solid var(--slate-100);
    }
    .change-row:last-child { border-bottom: none; }
    .change-label {
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--slate-500);
      margin-bottom: .2rem;
    }
    .old-val {
      background: #fff1f2;
      border-radius: .5rem;
      padding: .4rem .6rem;
      font-size: .82rem;
      color: #9f1239;
      word-break: break-word;
    }
    .new-val {
      background: #f0fdf4;
      border-radius: .5rem;
      padding: .4rem .6rem;
      font-size: .82rem;
      color: #166534;
      word-break: break-word;
    }
    .arrow-col {
      display: flex; align-items: center; justify-content: center;
      color: var(--slate-400);
      font-size: 1rem;
      padding-top: 1.4rem;
    }
    .preview-actions {
      padding: 1rem 1.2rem;
      display: flex;
      gap: .75rem;
      background: var(--slate-50);
      border-top: 1px solid var(--slate-200);
    }
    .btn-confirm {
      flex: 1;
      padding: .7rem 1rem;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: .75rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-confirm:hover { background: var(--teal-dark); }
    .btn-confirm:disabled { opacity: .55; cursor: not-allowed; }
    .btn-cancel {
      padding: .7rem 1rem;
      background: none;
      color: var(--slate-600);
      border: 1px solid var(--slate-200);
      border-radius: .75rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel:hover { background: var(--slate-100); }

    /* ── Input bar ── */
    #input-bar {
      flex-shrink: 0;
      padding: 1rem 1.5rem 1.2rem;
      background: var(--white);
      border-top: 1px solid var(--slate-200);
    }
    .suggestions {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .75rem;
    }
    .suggestion {
      font-size: .78rem;
      padding: .3rem .75rem;
      border: 1px solid var(--slate-200);
      border-radius: 2rem;
      background: var(--slate-50);
      color: var(--slate-700);
      cursor: pointer;
      transition: border-color .15s, background .15s;
      white-space: nowrap;
    }
    .suggestion:hover { border-color: var(--teal); background: var(--teal-light); color: var(--teal-dark); }
    .compose {
      display: flex;
      gap: .75rem;
      align-items: flex-end;
    }
    #msg-input {
      flex: 1;
      resize: none;
      border: 1px solid var(--slate-200);
      border-radius: 1rem;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-family: var(--font);
      color: var(--slate-900);
      line-height: 1.5;
      outline: none;
      transition: border-color .15s;
      max-height: 140px;
    }
    #msg-input:focus { border-color: var(--teal); }
    .compose-right { display: flex; gap: .5rem; align-items: center; }
    .btn-attach {
      width: 40px; height: 40px;
      border: 1px solid var(--slate-200);
      border-radius: .7rem;
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--slate-600);
      transition: border-color .15s;
      flex-shrink: 0;
    }
    .btn-attach:hover { border-color: var(--teal); color: var(--teal); }
    .btn-send {
      width: 40px; height: 40px;
      background: var(--teal);
      border: none;
      border-radius: .7rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    .btn-send:hover { background: var(--teal-dark); }
    .btn-send:disabled { opacity: .45; cursor: not-allowed; }
    .btn-send svg { fill: white; width: 18px; height: 18px; }
    #file-input { display: none; }
    #image-previews {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .5rem;
    }
    .img-thumb {
      position: relative;
      width: 60px; height: 60px;
      border-radius: .6rem;
      overflow: hidden;
      border: 1px solid var(--slate-200);
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-remove {
      position: absolute; top: 2px; right: 2px;
      width: 18px; height: 18px;
      background: rgba(0,0,0,.55);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Misc ── */
    .success-badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      border-radius: .4rem;
      padding: .15rem .5rem;
      font-size: .8rem;
      font-weight: 600;
      margin-right: .4rem;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════ LOGIN ═══════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <h1>Website Manager</h1>
    <p>Wander Bike Rentals — content editor</p>
    <label for="token-input">Access Password</label>
    <input id="token-input" type="password" placeholder="Enter your access password" />
    <p id="login-error">Incorrect password. Please try again.</p>
    <button class="btn-primary" id="login-btn">Sign In</button>
  </div>
</div>

<!-- ═══════════════════════════════ APP ═══════════════════════════════ -->
<div id="app">
  <header>
    <div class="header-brand">
      <div class="brand-dot">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      <div>
        <div class="brand-name">Website Manager</div>
        <div class="brand-sub">Wander Bike Rentals</div>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">Sign out</button>
  </header>

  <div id="messages">
    <div class="msg msg-bot">
      <strong>Hello!</strong> Tell me what you'd like to change on the website — phone number, prices, hours, text, or images. I'll show you a preview before anything goes live.
    </div>
  </div>

  <div id="input-bar">
    <div class="suggestions">
      <button class="suggestion" data-text="Change the phone number to ">📞 Update phone</button>
      <button class="suggestion" data-text="Change the hours to ">🕐 Update hours</button>
      <button class="suggestion" data-text="Change the adult bike price to ">💰 Update pricing</button>
      <button class="suggestion" data-text="Change the address to ">📍 Update address</button>
      <button class="suggestion" data-text="Replace the hero image with the one I'm uploading">🖼️ Swap image</button>
    </div>
    <div id="image-previews"></div>
    <div class="compose">
      <textarea id="msg-input" rows="1" placeholder="e.g. Change the phone number to (604) 555-0123"></textarea>
      <div class="compose-right">
        <button class="btn-attach" id="attach-btn" title="Upload image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
        </button>
        <input type="file" id="file-input" accept="image/*" multiple />
        <button class="btn-send" id="send-btn" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIG — fill these in to match your n8n setup
// ═══════════════════════════════════════════════════════════════════
const N8N_BASE        = 'https://zyz18922182165.app.n8n.cloud';
const WEBHOOK_PROCESS = 'wander-bike-rentals-cms';
const WEBHOOK_CONFIRM = 'wander-bike-rentals-cms-confirm';
const ACCESS_TOKEN    = 'wanderbikerental';
const SITE_SLUG       = 'wander-bike-rentals';

// ═══════════════════════════════════════════════════════════════════

let token = '';
const pendingCommits = {};
let pendingImages = [];

// ── Login ──────────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  const val = document.getElementById('token-input').value.trim();
  if (val === ACCESS_TOKEN) {
    token = val;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('msg-input').focus();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('token-input').select();
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {
  token = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('token-input').value = '';
});

// ── Suggestions ────────────────────────────────────────────────────
document.querySelectorAll('.suggestion').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = document.getElementById('msg-input');
    inp.value = btn.dataset.text;
    inp.focus();
    autoResize(inp);
    updateSendBtn();
  });
});

// ── Auto-resize textarea ───────────────────────────────────────────
const msgInput = document.getElementById('msg-input');
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}
msgInput.addEventListener('input', () => { autoResize(msgInput); updateSendBtn(); });
function updateSendBtn() {
  const hasText  = msgInput.value.trim().length > 0;
  const hasImage = pendingImages.length > 0;
  document.getElementById('send-btn').disabled = !hasText && !hasImage;
}

// ── Image attach ───────────────────────────────────────────────────
document.getElementById('attach-btn').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', async e => {
  for (const file of e.target.files) {
    const dataURL = await readFile(file);
    pendingImages.push({ name: file.name, type: file.type, data: dataURL });
    addThumb(dataURL, pendingImages.length - 1);
  }
  e.target.value = '';
  updateSendBtn();
});

function readFile(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = ev => resolve(ev.target.result);
    r.readAsDataURL(file);
  });
}

function addThumb(dataURL, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'img-thumb';
  wrap.dataset.idx = idx;
  wrap.innerHTML = `<img src="${dataURL}" /><button class="img-remove" data-idx="${idx}">✕</button>`;
  document.getElementById('image-previews').appendChild(wrap);
  wrap.querySelector('.img-remove').addEventListener('click', () => {
    pendingImages.splice(idx, 1);
    wrap.remove();
    updateSendBtn();
  });
}

// ── Send ───────────────────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!document.getElementById('send-btn').disabled) sendMessage();
  }
});

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text && pendingImages.length === 0) return;

  const images = [...pendingImages];
  pendingImages = [];
  document.getElementById('image-previews').innerHTML = '';

  // Show user bubble
  if (text) appendUserBubble(text);
  if (images.length) appendUserBubble(`[${images.length} image(s) attached]`);

  msgInput.value = '';
  autoResize(msgInput);
  updateSendBtn();

  const typingEl = showTyping();

  try {
    const res = await fetch(`${N8N_BASE}/webhook/${WEBHOOK_PROCESS}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, message: text, images, site: SITE_SLUG })
    });

    removeTyping(typingEl);

    if (!res.ok) {
      const errText = await res.text().catch(() => `HTTP ${res.status}`);
      appendBotText(`Something went wrong (${res.status}). Please try again. Details: ${errText}`);
      return;
    }

    const data = await res.json().catch(() => null);
    if (!data) { appendBotText('Got an empty response. Please try again.'); return; }

    if (data.type === 'preview') {
      renderPreview(data);
    } else {
      appendBotText(data.message || 'Done!');
    }
  } catch (err) {
    removeTyping(typingEl);
    appendBotText(`Could not reach the server. Check your internet connection and try again. (${err.message})`);
  }
}

// ── Render preview ─────────────────────────────────────────────────
function renderPreview(data) {
  pendingCommits[data.jobId] = data.commitData;

  const card = document.createElement('div');
  card.className = 'msg msg-bot';
  card.innerHTML = `
    <div class="preview-card">
      <div class="preview-header">Preview — confirm before publishing</div>
      <div class="preview-summary">${esc(data.summary || 'Here are the proposed changes:')}</div>
      <div class="changes-list" id="changes-${data.jobId}"></div>
      <div class="preview-actions">
        <button class="btn-confirm" id="confirm-${data.jobId}">Publish to website</button>
        <button class="btn-cancel" id="cancel-${data.jobId}">Cancel</button>
      </div>
    </div>`;

  const changesList = card.querySelector(`#changes-${data.jobId}`);
  (data.changes || []).forEach(ch => {
    const row = document.createElement('div');
    row.className = 'change-row';
    row.innerHTML = `
      <div>
        <div class="change-label">${esc(ch.field || 'Change')}</div>
        <div class="old-val">${esc(ch.oldValue || '—')}</div>
      </div>
      <div class="arrow-col">→</div>
      <div>
        <div class="change-label">New value</div>
        <div class="new-val">${esc(ch.newValue || '—')}</div>
      </div>`;
    changesList.appendChild(row);
  });

  appendMessage(card);

  card.querySelector(`#confirm-${data.jobId}`).addEventListener('click', () => confirmPublish(data.jobId, card));
  card.querySelector(`#cancel-${data.jobId}`).addEventListener('click', () => {
    delete pendingCommits[data.jobId];
    card.querySelector('.preview-actions').innerHTML = '<span style="font-size:.85rem;color:var(--slate-500)">Change cancelled.</span>';
  });
}

async function confirmPublish(jobId, card) {
  const commitData = pendingCommits[jobId];
  if (!commitData) { appendBotText('Session expired. Please make the change again.'); return; }

  const confirmBtn = card.querySelector(`#confirm-${jobId}`);
  const cancelBtn  = card.querySelector(`#cancel-${jobId}`);
  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Publishing…';
  if (cancelBtn) cancelBtn.disabled = true;

  try {
    const res = await fetch(`${N8N_BASE}/webhook/${WEBHOOK_CONFIRM}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, jobId, commitData })
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => `HTTP ${res.status}`);
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Publish to website';
      if (cancelBtn) cancelBtn.disabled = false;
      appendBotText(`Publish failed (${res.status}): ${errText}`);
      return;
    }

    const result = await res.json().catch(() => null);
    delete pendingCommits[jobId];
    card.querySelector('.preview-actions').innerHTML =
      `<span class="success-badge">✓ Published</span><span style="font-size:.85rem;color:var(--slate-600)">Your site will update in 1–2 minutes.</span>`;

    if (result && result.message) appendBotText(result.message);
  } catch (err) {
    confirmBtn.disabled = false;
    confirmBtn.textContent = 'Publish to website';
    if (cancelBtn) cancelBtn.disabled = false;
    appendBotText(`Publish failed: ${err.message}`);
  }
}

// ── Helpers ────────────────────────────────────────────────────────
function appendUserBubble(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-user';
  el.textContent = text;
  appendMessage(el);
}

function appendBotText(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-bot';
  el.textContent = text;
  appendMessage(el);
}

function appendMessage(el) {
  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg msg-bot';
  el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  appendMessage(el);
  return el;
}

function removeTyping(el) { if (el && el.parentNode) el.remove(); }

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
</script>
